<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Star Bus - Login</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .login-section {
            min-height: 600px;

            display: flex;

            justify-content: center;
            align-items: center;

            background-color: #f4f4f4;
        }

        .login-box {
            width: 380px;

            background-color: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 5px 20px #ccc;
        }

        .login-box h2 {
            text-align: center;

            color: #111;

            margin-bottom: 25px;
        }

        .login-box label {
            display: block;

            margin-top: 15px;

            font-weight: bold;
        }

        .login-box input {
            width: 100%;

            padding: 12px;

            margin-top: 7px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }

        .login-box button {
            width: 100%;

            margin-top: 25px;

            padding: 12px;

            border: none;

            border-radius: 5px;

            background-color: #ffd000;

            color: #111;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-box button:hover {
            background-color: #111;

            color: white;
        }

    </style>

</head>


<body>

    <!-- HEADER -->

    <header>

        <div class="logo">

            <h1>STAR BUS</h1>

        </div>

        <!-- INTERNAL LINK -->

        <nav>

            <a href="index.html">
                Home
            </a>

        </nav>

    </header>


    <!-- LOGIN FORM -->

    <section class="login-section">

        <div class="login-box">

            <h2>Customer Login</h2>

            <form action="#" method="post">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            &copy; 2026 Star Bus Transport Company
        </p>

    </footer>

</body>

</html>
